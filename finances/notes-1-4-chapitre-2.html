const b = s => Uint8Array.from(atob(s), x => x.charCodeAt(0));
async function ouvrir(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(D.s), iterations: D.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(D.i) }, cle, b(D.c)));
  try { sessionStorage.setItem("notes:cle", mdp); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("f");
f.addEventListener("submit", e => { e.preventDefault(); document.getElementById("err").hidden = true;
  ouvrir(document.getElementById("m").value).catch(() => { document.getElementById("err").hidden = false; }); });
// Le mot de passe déjà donné (dans l'app ou une autre note) ouvre la note tout de suite, jusqu'à la fermeture du navigateur.
let gardee = null; try { gardee = sessionStorage.getItem("notes:cle"); } catch (e) {}
(gardee ? ouvrir(gardee) : Promise.reject()).catch(() => {
  f.hidden = false; document.getElementById("m").focus();
  if (gardee) { document.getElementById("err").hidden = false; try { sessionStorage.removeItem("notes:cle"); } catch (e) {} }
});
